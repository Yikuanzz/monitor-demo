server:
  http_listen_port: 9281
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: demo3-logs
    static_configs:
      - targets:
        - localhost
        labels:
          job: demo3-logs
          __path__: /app/logs/*.log